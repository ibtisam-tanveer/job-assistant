<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="ext-root">
      <header class="ext-header">
        <span class="ext-logo" aria-hidden="true">JA</span>
        <div class="ext-title-block">
          <div class="ext-title">Job Assistant</div>
          <div class="ext-sub">LinkedIn → your inbox</div>
        </div>
      </header>

      <div class="ext-field">
        <label class="ext-label" for="apiUrl">API base URL</label>
        <input
          id="apiUrl"
          class="ext-input"
          type="text"
          placeholder="http://localhost:8000"
          autocomplete="off"
          spellcheck="false"
        />
      </div>
      <div class="ext-field">
        <label class="ext-label" for="secret">Ingest secret</label>
        <input
          id="secret"
          class="ext-input"
          type="password"
          placeholder="Same as INGEST_SECRET in .env"
          autocomplete="current-password"
        />
      </div>
      <div class="ext-field">
        <label class="ext-label" for="webUrl">Web app URL</label>
        <input
          id="webUrl"
          class="ext-input"
          type="text"
          placeholder="http://localhost:3000"
          autocomplete="off"
          spellcheck="false"
        />
      </div>

      <div class="ext-actions">
        <button type="button" id="save" class="ext-btn ext-btn--secondary">Save settings</button>
        <button type="button" id="send" class="ext-btn ext-btn--primary">
          Send current LinkedIn job
        </button>
      </div>

      <div id="status" class="ext-status" role="status" aria-live="polite"></div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
